name: Build

on:
  push:
    branches-ignore:
      - gh-pages
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint-and-web:
    name: Lint & Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build

  tauri-windows:
    name: Build Windows .exe / .msi
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install npm dependencies
        run: npm ci

      - name: Download mpv.exe (sidecar)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          $headers = @{ "User-Agent" = "cinema-iptv-2026-build" }
          if ($env:GITHUB_TOKEN) { $headers["Authorization"] = "Bearer $env:GITHUB_TOKEN" }
          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases?per_page=10" -Headers $headers
          $asset = $null
          foreach ($r in $releases) {
            $asset = $r.assets | Where-Object { $_.name -match "^mpv-x86_64-v3-\d{8}-git-[0-9a-f]+\.7z$" } | Select-Object -First 1
            if ($asset) { break }
          }
          if (-not $asset) { throw "Could not find mpv x86_64-v3 release asset" }
          Write-Host "Downloading $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mpv.7z -Headers $headers
          & 7z x mpv.7z -ompv-extracted -y | Out-Null
          $mpv = Get-ChildItem mpv-extracted -Filter mpv.exe -Recurse | Select-Object -First 1
          if (-not $mpv) { throw "mpv.exe not found in archive" }
          Copy-Item $mpv.FullName "src-tauri/binaries/mpv-x86_64-pc-windows-msvc.exe"
          Write-Host "mpv installed as sidecar, size: $((Get-Item src-tauri/binaries/mpv-x86_64-pc-windows-msvc.exe).Length)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Tauri (Windows)
        run: npx tauri build --target x86_64-pc-windows-msvc

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: cinema-iptv-2026-windows
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
